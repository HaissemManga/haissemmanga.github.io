<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HaissemManga</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        .container {
            max-width: 650px;
            margin: auto;
            padding: 50px 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        .description {
            color: #bbb;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        a {
            text-decoration: none;
            color: white;
        }

        .button {
            display: block;
            padding: 17px;
            border: 1px solid #555;
            border-radius: 12px;
            background: #1b1b1b;
            transition: 0.2s;
        }

        .button:hover {
            background: #fff;
            color: #111;
        }

        .section {
            margin-top: 40px;
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 50px;
            color: #666;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>HaissemManga</h1>

    <p class="description">
        Independent Mangaka & Creator
    </p>

    <div class="section">
        Follow Me
    </div>

    <div class="links">

        <a class="button" href="https://www.tiktok.com/" target="_blank">
            TikTok
        </a>

        <a class="button" href="https://www.instagram.com/" target="_blank">
            Instagram
        </a>

        <a class="button" href="https://www.youtube.com/" target="_blank">
            YouTube
        </a>

    </div>

    <div class="section">
        My Manga
    </div>

    <div class="links">

        <a class="button" href="#">
            📖 Read My Manga
        </a>

        <a class="button" href="#">
            ✍️ Latest Manga Updates
        </a>

    </div>

    <div class="section">
        Contact
    </div>

    <div class="links">

        <a class="button" href="mailto:your@email.com">
            📧 Official Email
        </a>

    </div>

    <footer>
        © 2026 HaissemManga
    </footer>

</div>

</body>
</html>
